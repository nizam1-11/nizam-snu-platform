name = "nizam-snu-platform"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat", "handle_cross_request_promise_resolution"]

# Cloudflare account
account_id = "c65dd30f1ccf3854709aa1d4bfd6a319"

# OpenNext Cloudflare output
main = ".open-next/worker.js"
assets = { directory = ".open-next/assets", binding = "ASSETS" }

# D1 Database (created via Cloudflare API)
[[d1_databases]]
binding = "DB"
database_name = "nizam-snu-db"
database_id = "1a45ea55-72bc-4a49-a12b-48f04d389384"
migrations_dir = "drizzle/migrations"

# R2 Storage
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "nizam-snu-storage"

# Environment variables (set as Workers secrets after deploy)
# BETTER_AUTH_SECRET
# RESEND_API_KEY

# Public vars (NEXT_PUBLIC_* are exposed to the client — this is not a secret)
[vars]
NEXT_PUBLIC_APP_URL = "https://nizam-snu-platform.nizam-snu-platform.workers.dev"
